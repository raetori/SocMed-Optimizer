name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ffmpeg -version | head -1
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check presets against platform specs with real ffmpeg
        run: npm run verify-presets
